[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Embedded CSS and HTML template of the run report.
"organiser/report.py" = ["E501"]


[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
